services:
  database:
    image: postgis/postgis:17-3.5
    container_name: temp-project-db

    environment:
      POSTGRES_DB: temp_project
      POSTGRES_USER: temp_user
      POSTGRES_PASSWORD: temp_password

    ports:
      - "5433:5432"

    volumes:
      - temp_project_postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temp_user -d temp_project"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  temp_project_postgres_data:
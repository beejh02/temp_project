spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5434/temp_project_test}
spring.datasource.username=${TEST_DB_USERNAME:temp_test_user}
spring.datasource.password=${TEST_DB_PASSWORD:temp_test_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration,classpath:db/testdata
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true

nurigo.demo-seed=42

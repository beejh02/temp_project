spring.application.name=nurigo

spring.datasource.url=jdbc:postgresql://localhost:5433/temp_project
spring.datasource.username=temp_user
spring.datasource.password=temp_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

server.port=8080

# 재현 가능한 데모 실행이 필요할 때만 정수 시드를 지정한다.
# 미지정 상태에서는 백엔드가 시작될 때마다 새 시드를 생성한다.

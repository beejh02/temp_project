name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프런트엔드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: my-app

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-app/package-lock.json

      - name: 의존성 설치
        run: npm ci

      - name: 테스트
        run: npm test

      - name: 정적 검사
        run: npm run lint

      - name: 프로덕션 빌드
        run: npm run build

  backend:
    name: 백엔드 검증
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/nurigo
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5434/temp_project_test
      TEST_DB_USERNAME: temp_test_user
      TEST_DB_PASSWORD: temp_test_password

    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: temp_project_test
          POSTGRES_USER: temp_test_user
          POSTGRES_PASSWORD: temp_test_password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U temp_test_user -d temp_project_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v7

      - name: Java 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            backend/nurigo/*.gradle*
            backend/nurigo/gradle/wrapper/gradle-wrapper.properties

      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      - name: 전체 테스트
        run: ./gradlew test --no-daemon
